<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مولد الأرقام العراقية</title>
</head>

<body>

<h1>🇮🇶 مولد أرقام عراقية وهمية</h1>

<h2 id="number">اضغط الزر</h2>

<button onclick="generateNumber()">توليد رقم جديد</button>

<script>
function generateNumber() {
    let number = "+96477";

    for (let i = 0; i < 9; i++) {
        number += Math.floor(Math.random() * 10);
    }

    document.getElementById("number").innerText = number;
}
</script>

</body>
</html>
